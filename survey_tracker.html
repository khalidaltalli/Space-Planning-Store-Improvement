<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Survey Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #0f1117 0%, #1a1f2e 100%);
            color: #e6edf3;
            min-height: 100vh;
            padding: 20px;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(135deg, #0f1117 0%, #1a1f2e 100%);
            z-index: 2000;
        }

        .login-screen.hidden {
            display: none !important;
        }

        .login-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .login-box {
            background: #1a1f2e;
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 2rem;
            width: 320px;
        }

        .login-box h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: #f1f5f9;
        }

        .login-box p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 1.5rem;
        }

        .login-form-group {
            margin-bottom: 10px;
        }

        .login-form-group label {
            font-size: 11px;
            color: #94a3b8;
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .login-input {
            width: 100%;
            background: #0f1117;
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            font-size: 12px;
            padding: 8px 10px;
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
        }

        .login-input:focus {
            outline: none;
            border-color: rgba(34, 211, 238, 0.4);
        }

        .login-btn {
            width: 100%;
            font-size: 12px;
            padding: 7px 16px;
            border-radius: 7px;
            border: 0.5px solid rgba(167, 139, 250, 0.3);
            background: rgba(167, 139, 250, 0.1);
            color: #a78bfa;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            transition: all 0.15s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: rgba(167, 139, 250, 0.18);
        }

        .login-error {
            font-size: 11px;
            color: #f87171;
            margin-top: 8px;
            display: none;
        }

        .login-error.show {
            display: block;
        }

        .login-error.show {
            display: block;
        }

        /* Main App */
        .app {
            display: none;
        }

        .app.show {
            display: block;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
            color: #0f1117;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(34, 211, 238, 0.3);
        }

        .btn-secondary {
            background: #1a1f2e;
            color: #22d3ee;
            border: 1px solid #22d3ee;
        }

        .btn-secondary:hover {
            background: #22d3ee;
            color: #0f1117;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1f2e;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }

        .stat-label {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #22d3ee;
        }

        .filters {
            background: #1a1f2e;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 150px;
        }

        .filter-group label {
            font-size: 12px;
            color: #8b949e;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            background: #0f1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #22d3ee;
        }

        table {
            width: 100%;
            background: #1a1f2e;
            border: 1px solid #30363d;
            border-radius: 12px;
            border-collapse: collapse;
            overflow: hidden;
        }

        thead {
            background: #0f1117;
            border-bottom: 2px solid #22d3ee;
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #22d3ee;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #30363d;
            font-size: 13px;
        }

        tbody tr:hover {
            background-color: rgba(34, 211, 238, 0.05);
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-open {
            background: rgba(168, 85, 247, 0.2);
            color: #d8b4fe;
        }

        .badge-closed {
            background: rgba(34, 197, 94, 0.2);
            color: #86efac;
        }

        .user-info {
            background: #1a1f2e;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .role-badge {
            display: inline-block;
            background: #22d3ee;
            color: #0f1117;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 16px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-wrap">
            <div class="login-box">
                <h1>📍 Site Survey Tracker</h1>
                <p>Space Planning & Store Improvement</p>
                <div class="login-form-group">
                    <label>Name</label>
                    <select id="nameInput" class="login-input" onchange="togglePinField()">
                        <option value="">Loading...</option>
                    </select>
                </div>
                <div id="pinWrap" class="login-form-group">
                    <label>PIN</label>
                    <input type="password" id="pinInput" class="login-input" placeholder="Enter PIN" required onkeydown="if(event.key==='Enter')handleLogin(event)">
                </div>
                <button type="button" class="login-btn" onclick="handleLogin(event)">Sign In</button>
                <div id="errorMsg" class="login-error"></div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app" id="mainApp">
        <div class="container">
            <div class="header">
                <h1>Site Survey Tracker</h1>
                <div>
                    <button class="btn btn-primary" id="addBtn">+ Add New Ticket</button>
                    <button class="btn btn-secondary" id="logoutBtn">Logout</button>
                </div>
            </div>

            <div class="user-info">
                <span id="userName">User</span>
                <span class="role-badge" id="userRole">Viewer</span>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Total</div>
                    <div class="stat-value" id="totalStat">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Open</div>
                    <div class="stat-value" id="openStat">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Closed</div>
                    <div class="stat-value" id="closedStat">0</div>
                </div>
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label>Status</label>
                    <select id="statusFilter">
                        <option value="">All</option>
                        <option value="Open">Open</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Surveyor</label>
                    <select id="surveyorFilter">
                        <option value="">All</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Location</label>
                    <input type="text" id="locationFilter" placeholder="Search...">
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button class="btn btn-secondary" id="resetBtn">Reset</button>
                </div>
            </div>

            <table id="ticketTable">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Site</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Surveyor</th>
                        <th>Reason</th>
                        <th>Action</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbw3BdhY9ti7B3W2i5OoINVEOFE58ysIQOn_6j-gUQo-pQdR_oYrmnqU5Q87qrgZpUBy/exec';
        const SHEET_ID = '1xd12yLTsOvPvurmhiTg060UDlu9a4Xr4_y8eqZtWPQQ'; // Site Survey Tracker sheet

        let currentUser = null;
        let currentRole = 'Viewer';
        let allUsers = [];
        let allTickets = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadUsersForDropdown();
            const auth = sessionStorage.getItem('auth');
            if (auth) {
                const data = JSON.parse(auth);
                currentUser = data.name;
                currentRole = data.role;
                showApp();
                loadData();
            } else {
                showLogin();
            }
        });

        // Load users and populate dropdown
        async function loadUsersForDropdown() {
            try {
                const res = await fetch(`${API_URL}?action=getUsers&sheetId=${SHEET_ID}`);
                const data = await res.json();

                if (data.success && data.users) {
                    allUsers = data.users;
                    populateUserDropdown();
                }
            } catch (err) {
                console.error('Error loading users:', err);
            }
        }

        function populateUserDropdown() {
            const select = document.getElementById('nameInput');
            select.innerHTML = '<option value="">Select your name</option>' +
                allUsers.map(u => `<option value="${u.Name}">${u.Name}</option>`).join('');
            togglePinField();
        }

        function togglePinField() {
            const name = document.getElementById('nameInput').value;
            const pinWrap = document.getElementById('pinWrap');
            // Show PIN field only if a user is selected
            pinWrap.style.display = name ? 'block' : 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('nameInput').value.trim();
            const pin = document.getElementById('pinInput').value.trim();

            if (!name) {
                showError('Please select your name');
                return;
            }

            if (!pin) {
                showError('Please enter your PIN');
                return;
            }

            try {
                // Find user with matching name
                const user = allUsers.find(u => u.Name && u.Name.trim() === name);

                if (!user) {
                    showError('User not found');
                    return;
                }

                // Compare PIN - convert both to string to handle number/string mismatch
                const userPin = String(user.PIN || '').trim();
                const enteredPin = String(pin).trim();

                if (userPin !== enteredPin) {
                    showError('Invalid PIN');
                    document.getElementById('pinInput').value = '';
                    return;
                }

                const role = (user['Receiving Tracker'] === 'Editor' || user['Receiving Tracker'] === 'Admin' || user.Role === 'Editor' || user.Role === 'Admin') ? 'Editor' : 'Viewer';
                
                sessionStorage.setItem('auth', JSON.stringify({ name, role }));
                currentUser = name;
                currentRole = role;

                showApp();
            } catch (err) {
                showError('Error: ' + err.message);
            }
        }

        async function loadData() {
            try {
                // Fetch surveys from Site Survey sheet
                const res = await fetch(`${API_URL}?action=getSurveys&sheetId=${SHEET_ID}`);
                const data = await res.json();

                if (data.success) {
                    allTickets = data.surveys || [];
                    renderTable(allTickets);
                    updateStats();
                    loadSurveyors();
                }
            } catch (err) {
                console.error('Error loading data:', err);
            }
        }

        function loadSurveyors() {
            const surveyers = [...new Set(allTickets.map(t => t['Surveyor / Team']))].filter(Boolean);
            const select = document.getElementById('surveyorFilter');
            surveyers.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                select.appendChild(opt);
            });
        }

        function renderTable(tickets) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            tickets.forEach(t => {
                const row = tbody.insertRow();
                const isOpen = t.Status.toLowerCase().includes('open');
                const badge = isOpen ? 'badge-open' : 'badge-closed';

                row.innerHTML = `
                    <td>${t['No.']}</td>
                    <td>${t['Site / Location']}</td>
                    <td>${t['Visit Date']}</td>
                    <td>${t['Visit Time']}</td>
                    <td>${t['Surveyor / Team']}</td>
                    <td>${t['Reason for Visit']}</td>
                    <td>${t['Required Action']}</td>
                    <td><span class="badge ${badge}">${t.Status}</span></td>
                `;
            });
        }

        function updateStats() {
            const total = allTickets.length;
            const open = allTickets.filter(t => t.Status.toLowerCase().includes('open')).length;
            const closed = total - open;

            document.getElementById('totalStat').textContent = total;
            document.getElementById('openStat').textContent = open;
            document.getElementById('closedStat').textContent = closed;
        }

        function filter() {
            const status = document.getElementById('statusFilter').value;
            const surveyor = document.getElementById('surveyorFilter').value;
            const location = document.getElementById('locationFilter').value.toLowerCase();

            const filtered = allTickets.filter(t => {
                const matchStatus = !status || t.Status.includes(status);
                const matchSurveyor = !surveyor || t['Surveyor / Team'] === surveyor;
                const matchLocation = !location || t['Site / Location'].toLowerCase().includes(location);
                return matchStatus && matchSurveyor && matchLocation;
            });

            renderTable(filtered);
        }

        function resetFilters() {
            document.getElementById('statusFilter').value = '';
            document.getElementById('surveyorFilter').value = '';
            document.getElementById('locationFilter').value = '';
            renderTable(allTickets);
        }

        function showLogin() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.remove('show');
        }

        function showApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('show');
            setupEventListeners();
            loadData();
        }

        function setupEventListeners() {
            document.getElementById('userName').textContent = currentUser;
            document.getElementById('userRole').textContent = currentRole;

            if (currentRole === 'Viewer') {
                document.getElementById('addBtn').style.display = 'none';
            }

            document.getElementById('addBtn').onclick = () => alert('Add ticket feature coming soon!');
            document.getElementById('logoutBtn').onclick = logout;
            document.getElementById('resetBtn').onclick = resetFilters;
            document.getElementById('statusFilter').onchange = filter;
            document.getElementById('surveyorFilter').onchange = filter;
            document.getElementById('locationFilter').oninput = filter;
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        function logout() {
            sessionStorage.removeItem('auth');
            currentUser = null;
            currentRole = 'Viewer';
            document.getElementById('nameInput').value = '';
            document.getElementById('pinInput').value = '';
            document.getElementById('errorMsg').textContent = '';
            togglePinField();
            showLogin();
        }
    </script>
</body>
</html>
